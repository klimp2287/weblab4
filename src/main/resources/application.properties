spring.application.name=weblab1

spring.datasource.url=jdbc:postgresql://localhost:5433/shop
spring.datasource.username=shop_user
spring.datasource.password=shop_pass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

app.jwt.secret=change-me-please-use-a-long-random-secret-key-123456
app.jwt.expiration-minutes=60